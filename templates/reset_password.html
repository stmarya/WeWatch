<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | WeWatch</title>
    <link rel="stylesheet" href="/static/wewatch-shell.css">
</head>
<body>
    <main class="login-layout auth-layout">
        <section class="surface login-card" aria-labelledby="pageTitle">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">W</span>
                <div><strong>WeWatch</strong><span>AI security & productivity</span></div>
            </div>
            <h1 id="pageTitle">Buat password baru</h1>
            <p class="muted">Setelah disimpan, semua sesi lama akan dikeluarkan.</p>
            {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
            <form method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="resetPassword">Password baru</label>
                <input id="resetPassword" type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="resetPasswordHint" required autofocus>
                <p class="field-hint" id="resetPasswordHint">Minimal 12 karakter, mengandung huruf dan angka.</p>
                <label for="resetPasswordConfirmation">Konfirmasi password baru</label>
                <input id="resetPasswordConfirmation" type="password" name="password_confirmation" autocomplete="new-password" minlength="12" maxlength="128" required>
                <button class="button primary" type="submit">Simpan password</button>
            </form>
        </section>
    </main>
</body>
</html>
