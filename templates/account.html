<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Akun Saya | WeWatch</title>
    <link rel="stylesheet" href="/static/wewatch-shell.css">
</head>
<body>
    <main class="shell account-shell">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">W</span>
            <div><strong>WeWatch</strong><span>Akun pengguna</span></div>
        </div>
        <section class="surface account-card" aria-labelledby="accountTitle">
            <div>
                <p class="eyebrow">Akun aktif</p>
                <h1 id="accountTitle">{{ user.display_name }}</h1>
                <p class="muted">{{ user.email }}</p>
            </div>
            <dl class="account-meta">
                <div><dt>Peran</dt><dd>{{ user.role }}</dd></div>
                <div><dt>Terdaftar</dt><dd>{{ user.created_at }}</dd></div>
                <div><dt>Login terakhir</dt><dd>{{ user.last_login_at or 'Login pertama' }}</dd></div>
            </dl>
            <div class="account-notice">
                <strong>Akun berhasil tercatat</strong>
                <p>Fitur monitoring dan remote control tetap dibatasi untuk administrator.</p>
            </div>
            <form method="post" action="/auth/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="button" type="submit">Keluar</button>
            </form>
        </section>
    </main>
</body>
</html>
