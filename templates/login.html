<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk Admin | WeWatch</title>
    <link rel="stylesheet" href="/static/wewatch-shell.css">
</head>
<body>
    <main class="login-layout">
        <form class="surface login-card" method="post" autocomplete="off">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">W</span>
                <div><strong>WeWatch</strong><span>AI security & productivity</span></div>
            </div>
            <h1>Masuk sebagai admin</h1>
            <p class="muted">Gunakan token admin untuk membuka dashboard monitoring.</p>
            <label for="adminToken">Token admin</label>
            <input id="adminToken" type="password" name="token" autocomplete="current-password" required autofocus>
            <button class="button primary" type="submit">Buka dashboard</button>
            {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        </form>
    </main>
</body>
</html>
