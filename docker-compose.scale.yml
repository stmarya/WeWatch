services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wewatch
      POSTGRES_PASSWORD: "${WEBWATCH_POSTGRES_PASSWORD:-change-me}"
      POSTGRES_DB: wewatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wewatch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:v1.8
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-change-me}:${LIVEKIT_API_SECRET:-change-me-to-a-long-random-secret}"
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--no-cli"]
    volumes:
      - ./infra/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres-data:
  redis-data: