# Reference only. docker-compose.scale.yml passes a secret-bearing LIVEKIT_CONFIG
# body from environment variables instead of mounting credentials from this file.
port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

redis:
  address: redis:6379
  # LIVEKIT_REDIS_PASSWORD is supplied by the deployment environment.