name: WeWatch CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wewatch
          POSTGRES_PASSWORD: wewatch
          POSTGRES_DB: wewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WEBWATCH_TEST_DATABASE_URL: postgresql://wewatch:wewatch@localhost:5432/wewatch_test
      WEBWATCH_MAIL_BACKEND: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install web, signaling, and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          Flask Flask-SocketIO python-dotenv redis websocket-client requests
          Pillow "psycopg[binary,pool]>=3.2,<4" fakeredis

      - name: Run unit tests (SQLite + PostgreSQL)
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate inline template JavaScript
        run: python tools/check_template_js.py

      - name: Validate UI and accessibility contracts
        run: python tools/check_ui_contracts.py

      - name: Smoke import signaling service
        run: PYTHONPATH=. python -c "import WebRTC_Meet.app"

      - name: Check whitespace errors
        run: git diff --check
