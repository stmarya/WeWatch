name: WeWatch CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install signaling runtime dependencies
        run: python -m pip install --disable-pip-version-check Flask Flask-SocketIO python-dotenv redis websocket-client requests

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate inline template JavaScript
        run: python tools/check_template_js.py

      - name: Smoke import signaling service
        run: PYTHONPATH=. python -c "import WebRTC_Meet.app"

      - name: Check whitespace errors
        run: git diff --check